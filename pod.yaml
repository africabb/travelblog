# Podman pod para el diario de Japón
# Uso:
#   podman play kube pod.yaml
#   podman pod stop japon-diary && podman pod rm japon-diary

apiVersion: v1
kind: Pod
metadata:
  name: japon-diary
spec:
  containers:
    - name: diary-api
      image: localhost/japon-diary:latest
      ports:
        - containerPort: 3001
          hostPort: 3001
      env:
        - name: PORT
          value: "3001"
        - name: OPENAI_API_KEY
          value: ""          # ← pon tu clave aquí o pásala con --env-file
        - name: ALLOWED_ORIGIN
          value: "*"
      volumeMounts:
        - name: diary-data
          mountPath: /app/server/data
        - name: diary-uploads
          mountPath: /app/server/uploads
  volumes:
    - name: diary-data
      hostPath:
        path: ./data
        type: DirectoryOrCreate
    - name: diary-uploads
      hostPath:
        path: ./uploads
        type: DirectoryOrCreate
